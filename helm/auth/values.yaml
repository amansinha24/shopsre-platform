image:
  repository: 350480401763.dkr.ecr.ap-south-1.amazonaws.com/shopsre/auth
  tag: 0ed689d0be8e70a2230a072787693f38c9f7332a
  pullPolicy: Always
service:
  type: ClusterIP
  port: 8081
replicaCount: 2
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
livenessProbe:
  path: /healthz
  initialDelaySeconds: 10
  periodSeconds: 10
readinessProbe:
  path: /healthz
  initialDelaySeconds: 5
  periodSeconds: 5
env:
  PORT: "8081"
  ENV: "production"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "shopsre"
  POSTGRES_USER: "shopsreAdmin"
  REDIS_PORT: "6379"
serviceAccount:
  create: true
  roleArn: "arn:aws:iam::350480401763:role/shopsre-auth-service-role"
