name: Reusable Python Service Pipeline

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      service_port:
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_ACCOUNT_ID:
        required: true
      AWS_REGION:
        required: true
      GIT_TOKEN:
        required: true

jobs:
  pipeline:
    name: ${{ inputs.service_name }}
    runs-on: ubuntu-latest

    env:
      IMAGE_URI: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/shopsre/${{ inputs.service_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/${{ inputs.service_name }}/requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ── Stage 1: Install and Test ───────────────────────────────
      - name: Install dependencies
        working-directory: services/${{ inputs.service_name }}
        run: pip install -r requirements.txt

      - name: Test
        working-directory: services/${{ inputs.service_name }}
        run: python -m pytest tests/ -v || true

      # ── Stage 2: Trivy Code Scan ───────────────────────────────
      - name: Trivy Code Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: services/${{ inputs.service_name }}
          severity: CRITICAL,HIGH
          exit-code: 0
          format: table

      # ── Stage 3: Build Docker image ────────────────────────────
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        working-directory: services/${{ inputs.service_name }}
        run: |
          docker build \
            -t ${{ env.IMAGE_URI }}:${{ github.sha }} \
            -t ${{ env.IMAGE_URI }}:latest \
            .

      # ── Stage 4: Trivy Image Scan ──────────────────────────────
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_URI }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 0
          format: table

      # ── Stage 5: Push to ECR ───────────────────────────────────
      - name: Push to ECR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker push ${{ env.IMAGE_URI }}:${{ github.sha }}
          docker push ${{ env.IMAGE_URI }}:latest

# ── Stage 10: Update image tag in Git ─────────────────────
      - name: Update image tag in Git
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Retry up to 5 times to handle concurrent pipeline conflicts
          for i in 1 2 3 4 5; do
            git pull origin main --rebase

            sed -i "s|tag: .*|tag: ${{ github.sha }}|g" \
              helm/${{ inputs.service_name }}/values.yaml

            git add helm/${{ inputs.service_name }}/values.yaml
            git commit -m "chore: update ${{ inputs.service_name }} image tag to ${{ github.sha }} [skip ci]" || true

            git push origin main && break || {
              echo "Push failed, retrying in 5 seconds..."
              sleep 5
            }
          done