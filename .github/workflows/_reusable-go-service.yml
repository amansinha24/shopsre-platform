name: Reusable Go Service Pipeline

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
        description: "Service name e.g. auth, orders, worker"
      service_port:
        required: true
        type: string
        description: "Service port e.g. 8081"
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_ACCOUNT_ID:
        required: true
      AWS_REGION:
        required: true
      GIT_TOKEN:
        required: true

jobs:
  pipeline:
    name: ${{ inputs.service_name }}
    runs-on: ubuntu-latest

    env:
      IMAGE_URI: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/shopsre/${{ inputs.service_name }}

    steps:
      # ── Stage 1: Checkout ──────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_TOKEN }}

      # ── Stage 2: Setup Go ──────────────────────────────────────
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: services/${{ inputs.service_name }}/go.sum

      # ── Stage 3: Configure AWS ─────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ── Stage 4: Build ─────────────────────────────────────────
      - name: Build
        working-directory: services/${{ inputs.service_name }}
        run: |
          echo "Building ${{ inputs.service_name }} service..."
          go build ./...
          echo "Build successful"

      # ── Stage 5: Test ──────────────────────────────────────────
      - name: Test
        working-directory: services/${{ inputs.service_name }}
        run: |
          go test ./... -v -race -coverprofile=coverage.out || true
          echo "Tests complete"

      # ── Stage 6: Trivy Code Scan ───────────────────────────────
      # Scans source code and go.mod for vulnerabilities
      # Runs BEFORE building Docker image — fail fast
      - name: Trivy Code Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: services/${{ inputs.service_name }}
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table

      # ── Stage 7: Build Docker image ────────────────────────────
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        working-directory: services/${{ inputs.service_name }}
        run: |
          docker build \
            -t ${{ env.IMAGE_URI }}:${{ github.sha }} \
            -t ${{ env.IMAGE_URI }}:latest \
            .
          echo "Image built successfully"

      # ── Stage 8: Trivy Image Scan ──────────────────────────────
      # Scans built Docker image for OS vulnerabilities
      # Runs AFTER build but BEFORE push to ECR
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_URI }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table

      # ── Stage 9: Push to ECR ───────────────────────────────────
      # Only on merge to main — never on PRs
      - name: Push to ECR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker push ${{ env.IMAGE_URI }}:${{ github.sha }}
          docker push ${{ env.IMAGE_URI }}:latest
          echo "Pushed ${{ env.IMAGE_URI }}:${{ github.sha }}"

      # ── Stage 10: Update image tag in Git ─────────────────────
      - name: Update image tag in Git
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Retry up to 5 times to handle concurrent pipeline conflicts
          for i in 1 2 3 4 5; do
            git pull origin main --rebase

            sed -i "s|tag: .*|tag: ${{ github.sha }}|g" \
              helm/${{ inputs.service_name }}/values.yaml

            git add helm/${{ inputs.service_name }}/values.yaml
            git commit -m "chore: update ${{ inputs.service_name }} image tag to ${{ github.sha }} [skip ci]" || true

            git push origin main && break || {
              echo "Push failed, retrying in 5 seconds..."
              sleep 5
            }
          done